<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar">
            <div class="navbar-container">
                <a href="#" class="navbar-logo">
                    <img src="../images/logo-videobelajar.svg" alt="Logo videobelajar">
                </a>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="auth-container body-medium-regular">
            <div class="auth-header">
                <h1 class="heading-3">Pendaftaran Akun</h1>
                <p>Yuk, daftarkan akunmu sekarang juga!</p>
            </div>
            <form class="auth-form" action="">
                <div class="form-field-wrapper">
                    <div class="form-field">
                        <label for="name">Nama Lengkap <span class="required">*</span></label>
                        <input class="input-text" type="text" name="name" id="name">
                    </div>
                    <div class="form-field">
                        <label for="email">E-Mail <span class="required">*</span></label>
                        <input class="input-text" type="email" name="email" id="email">
                    </div>
                    <div class="form-field">
                        <label for="gender">Jenis Kelamin <span class="required">*</span></label>
                        <select class="select" name="gender" id="gender" required>
                            <option value="" disabled selected>Pilih jenis kelamin</option>
                            <option value="male">Pria</option>
                            <option value="female">Wanita</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="no-hp">No. Hp <span class="required">*</span></label>
                        <div class="form-phone">
                            <div class="country-code">
                                <span class="country-code-flag-box">
                                    <img id="country-flag" src="../images/logo-id.svg" alt="">
                                </span>
                                <select class="country-code-select" id="country-code" name="country-code">
                                    <option value="+62" data-flag="../images/logo-id.svg" selected>+62</option>
                                </select>
                            </div>
                            <input class="input-text" type="tel" inputmode="numeric" name="no-hp" id="no-hp"
                                autocomplete="tel-national" pattern="[0-9]{8,13}" minlength="8" maxlength="13"
                                title="Masukkan 8 sampai 13 angka, tanpa spasi atau huruf" required>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="password">Kata Sandi <span class="required">*</span>
                        </label>
                        <div class="password-wrapper">
                            <input class="input-text-password" type="password" name="password" id="password">
                            <img src="../images/logo-eyeoff.svg" alt="Toggle Password " class="toggle-password">
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="confirm-password">Konfirmasi Kata Sandi <span class="required">*</span>
                        </label>
                        <div class="password-wrapper">
                            <input class="input-text-password" type="password" name="confirm-password"
                                id="confirm-password">
                            <img src="../images/logo-eyeoff.svg" alt="Toggle Password " class="toggle-password">
                        </div>
                    </div>
                    <div class="form-info-wrapper body-medium-medium">
                        <a href="#">Lupa Password?</a>
                    </div>
                </div>
                <div class="form-button-wrapper body-medium-bold">
                    <button class="btn-primary-contained">Daftar</button>
                    <button class="btn-primary-shadow">Masuk</button>
                </div>
                <div class="form-divider">
                    <span>atau</span>
                </div>
                <div class="form-google-wrapper">
                    <button class="btn-unstyled btn-google body-medium-bold">
                        <img src="../images/logo-google.svg" alt="Google Icon" class="google-icon">
                        <span>Masuk dengan Google</span>
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
